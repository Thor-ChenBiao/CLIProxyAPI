<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态 - AI 能量站</title>
    <script src="/static/i18n.js?v=20260525-2"></script>
    {% include "_portal_shell.html" %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #102033; line-height: 1.6; min-height: 100vh; }
        .container { max-width: 1120px; margin: 0 auto; padding: 24px 20px 44px; }
        .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .page-title h1 { color: #102033; font-size: 28px; line-height: 1.2; margin-bottom: 6px; letter-spacing: 0; }
        .page-title p { color: #64748b; font-size: 13px; }
        .refresh-btn { border: 1px solid #c7d9ff; background: #ffffff; color: #1d4ed8; border-radius: 7px; padding: 8px 13px; font-size: 13px; font-weight: 750; cursor: pointer; }
        .refresh-btn:hover { background: #eef4ff; }
        .summary { background: linear-gradient(135deg, #eef4ff 0%, #e7f8f4 100%); border: 1px solid #d7e5f2; border-radius: 10px; padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 18px; }
        .summary.degraded { background: linear-gradient(135deg, #fff1f2 0%, #fff7ed 100%); border-color: #fecdd3; }
        .status-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #0f766e; box-shadow: 0 0 0 5px rgba(15, 118, 110, 0.12); }
        .summary.degraded .status-dot { background: #dc2626; box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.12); }
        .status-text { font-size: 22px; font-weight: 850; color: #102033; }
        .status-sub { color: #64748b; font-size: 13px; margin-top: 5px; }
        .summary-stats { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
        .metric { min-width: 108px; text-align: right; }
        .metric-value { font-size: 24px; font-weight: 850; color: #102033; font-variant-numeric: tabular-nums; }
        .metric-label { color: #64748b; font-size: 12px; }
        .section { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04); }
        .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .section h2 { color: #1d4ed8; font-size: 18px; line-height: 1.3; }
        .section-desc { color: #64748b; font-size: 12px; margin-top: 3px; }
        .event-list { display: grid; gap: 12px; }
        .event { border: 1px solid #e2e8f0; border-left: 4px solid #94a3b8; border-radius: 8px; padding: 14px 15px; background: #fbfdff; }
        .event.open { border-left-color: #dc2626; background: #fffafa; }
        .event.notice { border-left-color: #2563eb; }
        .event.resolved { border-left-color: #0f766e; }
        .event-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
        .event-title { color: #102033; font-size: 15px; font-weight: 850; }
        .event-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 800; background: #edf1f5; color: #475569; white-space: nowrap; }
        .event.open .event-badge { background: #fee2e2; color: #b91c1c; }
        .event.notice .event-badge { background: #eef4ff; color: #1d4ed8; }
        .event.resolved .event-badge { background: #e7f8f4; color: #0f766e; }
        .event-summary { color: #334155; font-size: 13px; margin-bottom: 8px; }
        .event-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #64748b; font-size: 12px; }
        .event-note { margin-top: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 7px; padding: 9px 10px; color: #334155; font-size: 13px; }
        .admin-detail { margin-top: 10px; }
        .admin-detail summary { cursor: pointer; color: #1d4ed8; font-size: 12px; font-weight: 750; }
        .admin-detail pre { margin-top: 8px; padding: 10px; border-radius: 7px; background: #0f172a; color: #dbeafe; overflow: auto; font-size: 11px; max-height: 240px; }
        .note-editor { margin-top: 10px; display: grid; gap: 8px; }
        .note-editor textarea { width: 100%; min-height: 72px; border: 1px solid #d9e1ec; border-radius: 7px; padding: 9px 10px; font: inherit; font-size: 13px; resize: vertical; }
        .note-editor button { justify-self: start; border: 1px solid #c7d9ff; background: #eef4ff; color: #1d4ed8; border-radius: 7px; padding: 7px 11px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .empty { color: #64748b; text-align: center; padding: 28px 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; font-size: 13px; }
        .loading { color: #64748b; padding: 18px 0; font-size: 13px; }
        .error { color: #b91c1c; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
        @media (max-width: 720px) {
            .summary { grid-template-columns: 1fr; }
            .summary-stats { justify-content: flex-start; }
            .metric { text-align: left; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="page-head">
            <div class="page-title">
                <h1>服务状态</h1>
                <p>展示当前节点故障、历史故障和系统公告。页面会自动刷新。</p>
            </div>
            <button class="refresh-btn" type="button" onclick="loadStatus()">刷新状态</button>
        </div>

        <div id="errorBox" class="error"></div>
        <section id="summary" class="summary">
            <div>
                <div class="status-main">
                    <span class="status-dot"></span>
                    <span id="statusText" class="status-text">加载中</span>
                </div>
                <div id="statusSub" class="status-sub">正在读取状态事件...</div>
            </div>
            <div class="summary-stats">
                <div class="metric">
                    <div id="activeCount" class="metric-value">-</div>
                    <div class="metric-label">当前故障</div>
                </div>
                <div class="metric">
                    <div id="nodeCount" class="metric-value">-</div>
                    <div class="metric-label">配置节点</div>
                </div>
                <div class="metric">
                    <div id="eventCount" class="metric-value">-</div>
                    <div class="metric-label">历史事件</div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div>
                    <h2>当前故障</h2>
                    <div class="section-desc">节点探活连续失败后会进入这里，恢复后自动转入历史。</div>
                </div>
            </div>
            <div id="activeIncidents" class="event-list">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div>
                    <h2>历史故障与公告</h2>
                    <div class="section-desc">包含已恢复的节点故障，以及今日用量突破历史新高等公告。</div>
                </div>
            </div>
            <div id="recentEvents" class="event-list">
                <div class="loading">加载中...</div>
            </div>
        </section>
    </main>

    <script>
        let latestStatus = null;

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function eventStatusText(event) {
            if (event.status === 'open') return '进行中';
            if (event.status === 'resolved') return '已恢复';
            if (event.status === 'notice') return '公告';
            return event.status || '-';
        }

        function eventClass(event) {
            if (event.status === 'open') return 'open';
            if (event.status === 'resolved') return 'resolved';
            if (event.event_type === 'usage_record' || event.status === 'notice') return 'notice';
            return '';
        }

        function nodeText(event) {
            const nodes = event.affected_nodes || [];
            return nodes.length ? nodes.join(', ') : '-';
        }

        function renderEvent(event, isAdmin) {
            const meta = event.metadata && isAdmin
                ? `<details class="admin-detail"><summary>查看原始细节</summary><pre>${escapeHtml(JSON.stringify(event.metadata, null, 2))}</pre></details>`
                : '';
            const note = event.admin_note
                ? `<div class="event-note"><strong>处理说明：</strong>${escapeHtml(event.admin_note)}</div>`
                : '';
            const editor = isAdmin
                ? `<div class="note-editor">
                    <textarea id="note-${event.id}" placeholder="补充故障原因、处理过程或结论">${escapeHtml(event.admin_note || '')}</textarea>
                    <button type="button" onclick="saveNote(${event.id})">保存说明</button>
                </div>`
                : '';
            return `
                <article class="event ${eventClass(event)}">
                    <div class="event-top">
                        <div class="event-title">${escapeHtml(event.title)}</div>
                        <span class="event-badge">${escapeHtml(eventStatusText(event))}</span>
                    </div>
                    <div class="event-summary">${escapeHtml(event.summary || event.reason || '-')}</div>
                    <div class="event-meta">
                        <span>节点：${escapeHtml(nodeText(event))}</span>
                        <span>开始：${escapeHtml(formatTime(event.started_at))}</span>
                        ${event.resolved_at ? `<span>恢复：${escapeHtml(formatTime(event.resolved_at))}</span>` : ''}
                        <span>持续：${escapeHtml(event.duration || '-')}</span>
                        ${event.reason ? `<span>原因：${escapeHtml(event.reason)}</span>` : ''}
                    </div>
                    ${note}
                    ${editor}
                    ${meta}
                </article>
            `;
        }

        function renderList(el, events, isAdmin, emptyText) {
            if (!events.length) {
                el.innerHTML = `<div class="empty">${escapeHtml(emptyText)}</div>`;
                return;
            }
            el.innerHTML = events.map(event => renderEvent(event, isAdmin)).join('');
        }

        function renderStatus(data) {
            latestStatus = data;
            const summary = document.getElementById('summary');
            summary.classList.toggle('degraded', data.status === 'degraded');
            document.getElementById('statusText').textContent = data.status_text || '-';
            document.getElementById('statusSub').textContent = data.status === 'degraded'
                ? `影响节点：${(data.affected_nodes || []).join(', ') || '-'}`
                : `最近检查：${formatTime(data.checked_at)}`;
            document.getElementById('activeCount').textContent = data.active_incident_count || 0;
            document.getElementById('nodeCount').textContent = data.node_count || 0;
            document.getElementById('eventCount').textContent = (data.active_incidents || []).length + (data.recent_events || []).length;
            renderList(
                document.getElementById('activeIncidents'),
                data.active_incidents || [],
                data.is_admin,
                '当前没有进行中的故障'
            );
            renderList(
                document.getElementById('recentEvents'),
                data.recent_events || [],
                data.is_admin,
                '暂时没有历史故障或公告'
            );
        }

        async function loadStatus() {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            try {
                const resp = await fetch('/api/status', { headers: { Accept: 'application/json' } });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
                renderStatus(data);
            } catch (err) {
                errorBox.textContent = '状态加载失败：' + err.message;
                errorBox.style.display = 'block';
            }
        }

        async function saveNote(eventId) {
            const input = document.getElementById(`note-${eventId}`);
            if (!input) return;
            const btn = input.parentElement.querySelector('button');
            const original = btn.textContent;
            btn.disabled = true;
            btn.textContent = '保存中...';
            try {
                const resp = await fetch(`/api/status/events/${eventId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_note: input.value })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
                await loadStatus();
            } catch (err) {
                alert('保存失败：' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        document.addEventListener('DOMContentLoaded', loadStatus);
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
