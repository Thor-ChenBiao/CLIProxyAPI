<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Key Portal</title>
    <script src="/static/i18n.js?v=20260525-1"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7fb;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .shell {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(31, 45, 61, 0.12);
            overflow: hidden;
        }
        .brand {
            padding: 44px;
            background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 420px;
        }
        .brand h1 { font-size: 34px; line-height: 1.15; letter-spacing: 0; margin-bottom: 12px; }
        .brand p { font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.86); max-width: 440px; }
        .brand-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 34px;
        }
        .metric {
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 8px;
            padding: 14px;
            background: rgba(255,255,255,0.08);
        }
        .metric strong { display: block; font-size: 17px; margin-bottom: 4px; }
        .metric span { color: rgba(255,255,255,0.78); font-size: 12px; }
        .panel {
            padding: 42px 34px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .panel h2 { font-size: 24px; margin-bottom: 8px; color: #111827; letter-spacing: 0; }
        .panel p { color: #64748b; font-size: 14px; line-height: 1.7; margin-bottom: 26px; }
        .login-btn {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 8px;
            background: #1664ff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .login-btn:hover { background: #0f56d9; transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            font-size: 13px;
            line-height: 1.5;
        }
        .footer {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.6;
        }
        @media (max-width: 760px) {
            body { padding: 14px; align-items: stretch; }
            .shell { grid-template-columns: 1fr; }
            .brand { min-height: 260px; padding: 30px 24px; }
            .brand h1 { font-size: 28px; }
            .brand-meta { grid-template-columns: 1fr; margin-top: 22px; }
            .panel { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand">
            <div>
                <h1>AI 能量站</h1>
                <p>Key Portal 已接入飞书登录。请使用公司飞书账号进入页面和报表。</p>
            </div>
            <div class="brand-meta">
                <div class="metric">
                    <strong>统一身份</strong>
                    <span>飞书邮箱绑定 Key 归属</span>
                </div>
                <div class="metric">
                    <strong>状态化访问</strong>
                    <span>会话保存在服务端</span>
                </div>
            </div>
        </section>
        <section class="panel">
            <h2>飞书登录</h2>
            <p>登录后会回到你刚才访问的页面。历史浏览器 Key 会在登录后自动尝试归属到当前飞书邮箱。</p>
            <div id="errorBox" class="error"></div>
            <button id="loginBtn" class="login-btn" type="button" onclick="startFeishuLogin()">使用飞书登录</button>
            <div class="footer">仅 key-portal 页面使用此登录态；管理节点接口仍按原有权限链路处理。</div>
        </section>
    </main>

    <script>
        const nextUrl = {{ next_url|tojson }};
        const loginError = {{ login_error|tojson }};

        function showError(message) {
            const box = document.getElementById('errorBox');
            box.textContent = message || '登录失败，请稍后重试';
            box.style.display = 'block';
        }

        function loginErrorText(code) {
            if (!code) return '';
            if (code === 'invalid_state') return '登录状态已失效，请重新发起飞书登录。';
            if (code === 'save_failed') return '登录成功但保存用户信息失败，请联系管理员。';
            return decodeURIComponent(code);
        }

        async function startFeishuLogin() {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '正在跳转飞书...';
            try {
                const resp = await fetch('/api/feishu/login-url?next=' + encodeURIComponent(nextUrl || '/'));
                const data = await resp.json();
                if (!resp.ok || data.error || !data.url) {
                    throw new Error(data.error || '无法获取飞书登录地址');
                }
                window.location.href = data.url;
            } catch (err) {
                btn.disabled = false;
                btn.textContent = '使用飞书登录';
                showError(err.message);
            }
        }

        const initialError = loginErrorText(loginError);
        if (initialError) showError(initialError);
    </script>
</body>
</html>
