# HTTP-01 endpoint for token.zasdas.com. The NLB port 80 target group contains
# only node A, which is the cluster's certificate authority.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name token.zasdas.com _;

    location = /acme-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://token.zasdas.com$request_uri;
    }
}
